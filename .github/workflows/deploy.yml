name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workerbbs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 这些密钥需在仓库 Settings → Secrets and variables → Actions 中配置
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # 自动创建 D1 数据库，并把真实 database_id 注入 wrangler.toml
      # （无需 R2：头像/背景图以 base64 直接存进 D1）
      - name: Provision D1 & R2 and inject database_id
        run: |
          set -e
          echo "==> 1/4 创建 D1 数据库（已存在则忽略，幂等）"
          # 不依赖 --json：无论 table 还是 JSON 输出，下面都用正则抓 UUID
          npx wrangler d1 create workerbbs >/tmp/d1_create.log 2>&1 || true

          echo "==> 2/4 查询 D1 database_id"
          # 关键：不能用 `d1 info workerbbs`！它会按库名去 wrangler.toml 找 [[d1_databases]] 绑定，
          # 然后拿【还是占位符的】database_id（REPLACE_WITH_YOUR_D1_DATABASE_ID）去查 API → 404（代码 7404）。
          # 改用 `d1 list`（按账户列出全部库），用库名匹配取真实 uuid。
          LIST_OUT=$(npx wrangler d1 list 2>/tmp/d1_list_err) || true
          DB_ID=$(printf '%s' "$LIST_OUT" | grep -iE 'workerbbs' | grep -oE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(printf '%s' "$LIST_OUT" | grep -oE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::无法从 d1 list 获取 D1 database_id，以下是 Cloudflare 原始输出："
            echo "----- d1 create 输出 -----"; cat /tmp/d1_create.log
            echo "----- d1 list 输出 -----";  cat /tmp/d1_list_err
            if grep -qiE 'authentication|unauthorized|invalid.*token|10000|9109|permission|forbidden' /tmp/d1_create.log /tmp/d1_list_err; then
              echo "👉 极可能是 CLOUDFLARE_API_TOKEN 无效或权限不足（需要 Account · D1:Edit）。"
            fi
            echo "也请确认 CLOUDFLARE_ACCOUNT_ID 正确、且数据库名 workerbbs 未被占用。"
            exit 1
          fi
          echo "D1 database_id = $DB_ID"

          echo "==> 3/4 注入 database_id 到 wrangler.toml"
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$DB_ID/" wrangler.toml

          echo "==> 4/4 处理自定义域名"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            sed -i "s|REPLACE_WITH_YOUR_CUSTOM_DOMAIN|$CUSTOM_DOMAIN|" wrangler.toml
            echo "自定义域名 = $CUSTOM_DOMAIN（部署时将自动添加 DNS，需 Token 具备 DNS:Edit）"
          else
            echo "未设置 CUSTOM_DOMAIN，部署到 *.workers.dev"
            sed -i '/REPLACE_WITH_YOUR_CUSTOM_DOMAIN/d' wrangler.toml
          fi

      - name: Apply D1 migrations
        # 该版本 wrangler 无 --yes，用 echo "y" 喂交互确认（无待应用迁移时多喂的 y 无害）
        run: echo "y" | npx wrangler d1 migrations apply workerbbs --remote

      - name: Seed admin account
        run: node scripts/seed-admin.mjs

      - name: Deploy Worker
        run: npx wrangler deploy
