name = "workerbbs"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 部署到 *.workers.dev（免费）。若要绑定自己的域名，见 README「自定义域名」一节。
workers_dev = true

# 自定义域名（可选）：部署时 Cloudflare 会自动为该域名添加 DNS 记录。
# 域名由 GitHub Secrets 的 CUSTOM_DOMAIN 注入；若未设置则 CI 会自动删除本行。
# 使用 routes + custom_domain=true（wrangler 3.x 支持的写法，会自动加 DNS）。
# 注意：必须放在根层级，否则会被 TOML 吸收进它前面的 [[r2_buckets]] 而失效。
routes = [{ pattern = "REPLACE_WITH_YOUR_CUSTOM_DOMAIN", custom_domain = true }]

# ===== 静态资源（前端 SPA）=====
# 由 Worker 通过 env.ASSETS 提供；非 /api/* 的请求回退到 index.html（SPA）
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ===== 环境变量（非密钥，可提交）=====
[vars]
SITE_NAME = "WorkerBBS"

# ===== D1 数据库 =====
# 首次部署前请先执行: wrangler d1 create workerbbs
# 然后把返回的 database_id 填到下面
[[d1_databases]]
binding = "DB"
database_name = "workerbbs"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ===== 文件存储说明 =====
# 本站不依赖 R2：头像 / 背景图以 base64 data URL 直接存进 D1 的 users 表与 settings 表。
# 因此无需配置任何 R2 桶，也不需要在 Cloudflare 开通 R2。
