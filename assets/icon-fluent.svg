<?xml version="1.0" encoding="UTF-8"?>
<!--
  WorkerBBS App Icon — Microsoft Fluent Design language
  • Rounded-square app tile with blue→purple brand gradient
  • Light depth: soft drop shadow + top-left sheen
  • Single geometric glyph: chat bubble + typing dots (forum / conversation)
  • Cohesive palette with the site accent (#4f8cff → #7c5cff)
-->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WorkerBBS">
  <defs>
    <!-- Brand tile gradient (blue → indigo → purple) -->
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1A6FCB"/>
      <stop offset="55%" stop-color="#3B5BD9"/>
      <stop offset="100%" stop-color="#6A4BE0"/>
    </linearGradient>

    <!-- Top-left light sheen (Fluent "light" principle) -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Dot color: mid brand blue -->
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E6BE6"/>
      <stop offset="100%" stop-color="#5B4BE0"/>
    </linearGradient>

    <!-- Soft elevation shadow -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A0E1A" flood-opacity="0.35"/>
    </filter>

    <!-- Clip sheen to the rounded tile -->
    <clipPath id="tileClip">
      <rect x="20" y="20" width="216" height="216" rx="46"/>
    </clipPath>
  </defs>

  <!-- Tile with elevation -->
  <g filter="url(#softShadow)">
    <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#tileGrad)"/>
  </g>

  <!-- Sheen overlay -->
  <g clip-path="url(#tileClip)">
    <rect x="20" y="20" width="216" height="216" fill="url(#sheen)"/>
  </g>

  <!-- Subtle inner edge (Fluent material highlight) -->
  <rect x="20.5" y="20.5" width="215" height="215" rx="45.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Back bubble (depth / layered conversation) -->
  <rect x="150" y="44" width="62" height="56" rx="20" fill="#ffffff" opacity="0.14"/>

  <!-- Main chat bubble (white) -->
  <g>
    <rect x="68" y="58" width="120" height="104" rx="30" fill="#ffffff"/>
    <path d="M92 146 L74 184 L122 158 Z" fill="#ffffff"/>
  </g>

  <!-- Typing dots (conversation / forum) -->
  <g fill="url(#dotGrad)">
    <circle cx="104" cy="108" r="9"/>
    <circle cx="128" cy="108" r="9"/>
    <circle cx="152" cy="108" r="9"/>
  </g>
</svg>
