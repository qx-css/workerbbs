name = "workerbbs-ws"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# 变量（非密钥也可提交）
# NODE_DOMAIN 默认占位，CI 部署时会用仓库变量 WS_DOMAIN 覆盖（Settings → Variables 配置）。
[vars]
USER_ID = "default"
NODE_DOMAIN = "ws.example.workers.dev"

# 主仓库（workerbbs）「实时同步」只需填：
#   - WebSocket 端点  = 本节点的 wss 地址（如 wss://workerbbs-ws.<subdomain>.workers.dev）
# 无需 API 密钥，节点开放广播。

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# 免费套餐必须用 new_sqlite_classes 迁移创建 DO 命名空间（否则报 10097）
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
